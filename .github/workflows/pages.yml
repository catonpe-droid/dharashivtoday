name: Publish Dharashiv Today
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: dharashivtoday-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build newsroom
        run: node scripts/build.mjs
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install share-image support
        run: python -m pip install --disable-pip-version-check pillow
      - name: Generate same-host social previews
        run: python scripts/share_images.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
